[workspace]
resolver = "2"
members = [
    "crates/peace-control-core",
    "crates/peace-control-app",
    "crates/peace-control-cli",
]

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["PeaceControl contributors"]
repository = "https://github.com/tokyonocturn/PeaceControl"

[workspace.dependencies]
peace-control-core = { path = "crates/peace-control-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
